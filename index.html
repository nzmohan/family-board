<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0e9f8e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Board" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>Our Family Board</title>
</head>
<body>
  <!-- Lock / setup screen -->
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-logo">🏔️</div>
      <h1 id="gate-title">Our Family Board</h1>
      <p id="gate-sub" class="muted">Enter the family passcode</p>

      <!-- unlock -->
      <div id="gate-unlock">
        <input id="gate-pass" class="big-input" type="password"
               autocomplete="off" autocapitalize="off" placeholder="Passcode" />
        <button id="gate-unlock-btn" class="btn primary block">Open</button>
        <p id="gate-err" class="error hidden"></p>
      </div>

      <!-- first-time setup: names only (passcode already chosen above) -->
      <div id="gate-setup" class="hidden">
        <label class="field"><span>Your name</span>
          <input id="setup-name1" class="big-input" type="text" autocomplete="off" placeholder="Mo" />
        </label>
        <label class="field"><span>Your partner's name</span>
          <input id="setup-name2" class="big-input" type="text" autocomplete="off" placeholder="e.g. Sarah" />
        </label>
        <button id="setup-btn" class="btn primary block">Start our board</button>
        <p id="setup-err" class="error hidden"></p>
      </div>
    </div>
  </div>

  <!-- Who-are-you (per device) -->
  <div id="who" class="gate hidden">
    <div class="gate-card">
      <div class="gate-logo">👋</div>
      <h1>Who's using this phone?</h1>
      <p class="muted">So we can tag who added what.</p>
      <div id="who-options" class="who-options"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title">
        <span class="me-dot" id="me-dot"></span>
        <span id="me-name">—</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-export" class="icon-btn" title="Copy for Claude">📤</button>
        <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- ===== BOARD VIEW ===== -->
    <div id="view-board" class="view">
      <nav id="tabs" class="tabs"></nav>
      <main id="board" class="board"></main>
      <form id="add-form" class="add-bar">
        <textarea id="add-text" class="add-text" rows="1"
          placeholder="Type an idea or to-do…  (tap 🎤 on your keyboard to speak)"></textarea>
        <button type="submit" id="add-btn" class="btn primary add-btn">Add</button>
      </form>
    </div>

    <!-- ===== LISTS VIEW ===== -->
    <div id="view-lists" class="view hidden">
      <main id="lists" class="scroll-area"></main>
      <div class="add-bar">
        <input id="new-list-name" class="add-text" type="text" placeholder="New list name (e.g. Grocery)" />
        <button id="new-list-btn" class="btn primary add-btn">+ List</button>
      </div>
    </div>

    <!-- ===== DATES VIEW ===== -->
    <div id="view-dates" class="view hidden">
      <main id="dates" class="scroll-area"></main>
      <button id="new-date-btn" class="btn primary block fab-add">＋ Add a date</button>
    </div>

    <!-- bottom nav -->
    <nav id="nav" class="bottom-nav">
      <button class="nav-btn active" data-view="board"><span>📋</span>Board</button>
      <button class="nav-btn" data-view="lists"><span>✅</span>Lists</button>
      <button class="nav-btn" data-view="dates"><span>📅</span>Dates</button>
    </nav>
  </div>

  <!-- List detail sheet -->
  <div id="list-sheet" class="sheet-overlay hidden">
    <div class="sheet">
      <div class="list-sheet-head">
        <h2 id="list-sheet-title">List</h2>
        <button id="list-rename" class="icon-btn dark" title="Rename">✏️</button>
      </div>
      <div id="list-items" class="list-items"></div>
      <form id="list-add-form" class="list-add">
        <input id="list-add-text" class="big-input" type="text" placeholder="Add an item… (🎤 works too)" />
        <button type="submit" class="btn primary">Add</button>
      </form>
      <button id="list-clear-done" class="btn block">🧹 Clear ticked items</button>
      <button id="list-delete" class="btn danger block">🗑️ Delete whole list</button>
      <button id="list-close" class="btn ghost block">Close</button>
    </div>
  </div>

  <!-- Add/edit date sheet -->
  <div id="date-sheet" class="sheet-overlay hidden">
    <div class="sheet">
      <h2 id="date-sheet-title">Add a date</h2>
      <label class="field"><span>What is it?</span>
        <input id="date-title" class="big-input" type="text" placeholder="e.g. Araliya's recital" /></label>
      <div class="row2">
        <label class="field"><span>Date</span>
          <input id="date-date" class="big-input" type="date" /></label>
        <label class="field"><span>Time (optional)</span>
          <input id="date-time" class="big-input" type="time" /></label>
      </div>
      <label class="field"><span>Notes (optional)</span>
        <input id="date-notes" class="big-input" type="text" placeholder="e.g. school hall" /></label>
      <button id="date-save" class="btn primary block">Save</button>
      <button id="date-delete" class="btn danger block hidden">🗑️ Delete</button>
      <button id="date-cancel" class="btn ghost block">Cancel</button>
    </div>
  </div>

  <!-- Card action sheet -->
  <div id="sheet" class="sheet-overlay hidden">
    <div class="sheet">
      <div id="sheet-text" class="sheet-text"></div>
      <div class="sheet-meta" id="sheet-meta"></div>
      <div class="sheet-section">Move to</div>
      <div id="sheet-moves" class="sheet-moves"></div>
      <button id="sheet-edit" class="btn block">✏️ Edit</button>
      <button id="sheet-delete" class="btn danger block">🗑️ Delete</button>
      <button id="sheet-cancel" class="btn ghost block">Cancel</button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div id="settings" class="sheet-overlay hidden">
    <div class="sheet">
      <h2>Settings</h2>
      <label class="field"><span>Person 1 name</span>
        <input id="set-name1" class="big-input" type="text" /></label>
      <label class="field"><span>Person 2 name</span>
        <input id="set-name2" class="big-input" type="text" /></label>
      <div class="sheet-section">Column names</div>
      <div id="set-columns"></div>
      <button id="set-save" class="btn primary block">Save</button>
      <button id="set-switch" class="btn block">🔄 Switch who I am on this phone</button>
      <button id="set-export" class="btn block">📤 Copy everything for Claude</button>
      <button id="set-lock" class="btn block">🔒 Lock this phone</button>
      <button id="set-cancel" class="btn ghost block">Close</button>
      <p class="muted tiny" id="set-version"></p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
